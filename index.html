<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="VT Markets 账户注册入口。填写基本信息，开始账户申请。" />
    <title>VT Markets | 开始注册</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="header">
      <a class="brand" href="#landing" aria-label="VT Markets 首页"><img src="assets/vt-logo.webp" alt="VT Markets" /></a>
      <div class="header-actions"><span>已有账户？</span><a href="https://myaccount.vtmarketsfr.com/login">登录</a><span class="language">中文⌄</span></div>
    </header>

    <main>
      <section class="screen landing-screen" id="landing">
        <div class="landing-bg"><img src="assets/hero-market.webp" alt="金融市场视觉" /></div><div class="landing-shade"></div>
        <div class="landing-layout">
          <div class="landing-content">
            <p class="eyebrow"><span></span> VT Markets · 全球多资产平台</p>
            <h1>开始注册，<br /><em>从这里开始。</em></h1>
            <p class="landing-copy">填写基本信息，进入官方账户申请流程。</p>
            <p class="landing-note">提交后将进入官方申请页面。本页不收集资金或交易指令。</p>
          </div>

          <div class="register-card landing-register-card">
            <div class="card-top"><span>账户注册</span><b>⌁ 受保护的流程</b></div>
            <div class="account-tabs" role="tablist">
              <button type="button" class="tab active" data-mode="real" role="tab" aria-selected="true">真实账户</button>
              <button type="button" class="tab" data-mode="demo" role="tab" aria-selected="false">模拟账户</button>
            </div>
            <form id="register-form">
              <label>姓名<input name="name" type="text" placeholder="请输入姓名" autocomplete="name" required /></label>
              <label>邮箱<input name="email" type="email" placeholder="请输入邮箱" autocomplete="email" required /></label>
              <label class="agree"><input type="checkbox" required /><span>我已阅读并同意相关条款与隐私政策</span></label>
              <button class="submit button-primary" type="submit">开始注册 <span>↗</span></button>
            </form>
            <p class="form-footnote">提交后将进入官方账户申请页面。本页不收集资金或交易指令。</p>
            <div class="success" role="status">信息已准备好，请继续完成官方申请。</div>
            <div class="home-help-links">
              <button type="button" data-info="features">了解平台功能 <span>↗</span></button>
              <button type="button" data-info="products">查看可用产品 <span>↗</span></button>
              <button type="button" data-info="risk">阅读风险提示 <span>↗</span></button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div class="info-drawer" aria-hidden="true"><div class="drawer-backdrop" data-close-info></div><aside class="drawer-panel"><button class="drawer-close" type="button" data-close-info aria-label="关闭">×</button><p class="eyebrow eyebrow-dark"><span></span> 进一步了解</p><h2 id="drawer-title">平台功能</h2><div id="drawer-content"></div></aside></div>
    <footer class="footer"><img src="assets/vt-logo.webp" alt="VT Markets" /><span>© 2026 VT Markets</span><a href="https://www.vtmarketsfr.com/regulation/">法律与监管</a></footer>
    <script src="script.js"></script>
  </body>
</html>
